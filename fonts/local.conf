<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts named by the SVGs of the site and not installed (proprietary): the closest free ones, rather than the generic
  fallback (Noto Sans). Installed as /etc/fonts/local.conf, read after the aliases of the packages (Arial: Liberation
  Sans, Calibri: Carlito, Cambria: Caladea, Helvetica: Nimbus Sans...).
-->
<fontconfig>
  <!-- wide sans: DejaVu Sans is the closest in widths (it comes from Bitstream Vera, designed for the same purpose) -->
  <alias binding="same">
    <family>Verdana</family>
    <accept><family>DejaVu Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Tahoma</family>
    <accept><family>DejaVu Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Geneva</family>
    <accept><family>DejaVu Sans</family></accept>
  </alias>

  <alias binding="same">
    <family>Comic Sans MS</family>
    <accept><family>Comic Neue</family></accept>
  </alias>

  <!-- condensed heavy -->
  <match target="pattern">
    <test name="family"><string>Impact</string></test>
    <edit name="family" mode="assign" binding="same"><string>Nimbus Sans Narrow</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>

  <!-- Arial Black: Liberation Sans has no black weight, bold is the closest -->
  <match target="pattern">
    <test name="family"><string>Arial Black</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>

  <!--
    PostScript names (Illustrator writes them): family, weight and slant. Without this, Arial-BoldMT is unknown: Noto
    Sans, regular.
  -->
  <match target="pattern">
    <test name="family"><string>ArialMT</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-BoldMT</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-ItalicMT</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
    <edit name="slant" mode="assign"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-BoldItalicMT</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
    <edit name="slant" mode="assign"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-Black</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica-Bold</string></test>
    <edit name="family" mode="assign" binding="same"><string>Nimbus Sans</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>MyriadPro-Bold</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>TimesNewRomanPSMT</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>TimesNewRomanPS-BoldMT</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Serif</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
</fontconfig>
