version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
    open-pull-requests-limit: 99
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: 'weekly'
  # the image of the test S3 server (docker-compose.s3.yml, pinned by digest)
  - package-ecosystem: docker-compose
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: 'weekly'
