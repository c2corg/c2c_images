name: Continuous integration

on:
  pull_request:
    branches:
      - '**'
  push:
    branches: [main]
    tags:
      - '**'

# read only by default: the jobs that need more ask for it (create-release)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/*']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: npm install, lint and build
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Run an S3 server for testing s3
        run: docker compose -f docker-compose.s3.yml up -d s3
      - name: Run the unit tests, as well as tests against the S3 server
        run: npm run test:ci
      - name: Ensure docker-compose stopped
        run: docker compose -f docker-compose.s3.yml stop || true
        if: always()
      - name: Send coverage to codacy
        # secrets are not available for PR from forks, and dependabot PRs
        if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: reports/coverage/lcov.info

  docker:
    # the image works: sharp and its fonts, uploads of each kind
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t c2c_images:ci .
      - name: Upload images to a container
        run: |
          docker run -d --name images -p 8080:8080 --health-interval=2s -e STORAGE_BACKEND=local -e INCOMING_FOLDER=/tmp/incoming \
            -e ACTIVE_FOLDER=/tmp/active -e API_SECRET_KEY=ci c2c_images:ci
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ping && break; sleep 1; done
          for f in violin.jpg piano.png animated.gif pipe_organ.svg; do
            curl -sf -F "file=@test/data/$f" http://localhost:8080/upload | tee /dev/stderr | grep -q '"filename"'
          done
          docker exec images ls -l /tmp/incoming
          test "$(docker exec images ls /tmp/incoming | wc -l)" -eq 16
      - name: Health check of the container
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' images)
            [ "$status" = healthy ] && exit 0
            sleep 1
          done
          echo "health: $status"
          exit 1
      - name: Container logs
        if: always()
        run: docker logs images || true

  publish:
    # only publish if tests passed
    needs: [test, docker]
    # only publish images for tags and main branch
    if: "contains(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: c2corg/c2c_images
          tags: |
            type=ref,event=tag,priority=610
            type=ref,event=branch,priority=600
      - name: Publish the docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # the classic Docker manifest, without attestation: the Docker Engine of the production hosts (1.12) cannot
          # pull an OCI index ("missing signature key"). Tags stay on the `tags` input: `outputs` has no `name`
          provenance: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: VERSION=${{ fromJSON(steps.docker_meta.outputs.json).labels['org.opencontainers.image.version'] }}
      # the production hosts only pull the classic manifest: fail if an OCI index was published
      - name: Check the manifest of the published image
        env:
          TAGS: ${{ steps.docker_meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            type=$(docker buildx imagetools inspect --raw "$tag" | jq -r .mediaType)
            echo "$tag: $type"
            test "$type" = application/vnd.docker.distribution.manifest.v2+json
          done

  create-release:
    needs: [test, docker]
    if: "startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create or update release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
